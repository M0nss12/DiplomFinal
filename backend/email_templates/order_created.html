<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: sans-serif; color: #333; background: #f4f7f6; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <div style="background: #2563eb; padding: 30px; text-align: center; color: #fff;">
            <h2>Заказ принят! 📦</h2>
        </div>
        <div style="padding: 30px;">
            <p>Здравствуйте, <b>{{name}}</b>!</p>
            <p>Ваш заказ <b>#{{order_id}}</b> успешно создан и уже передан в отдел обработки.</p>
            <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin: 20px 0;">
                <p style="margin: 0;">Сумма к оплате: <b style="font-size: 20px; color: #2563eb;">{{total}} ₽</b></p>
            </div>
            <p>Вы можете следить за статусом заказа в вашем <a href="https://diplomfinal.onrender.com" style="color: #2563eb;">личном кабинете</a>.</p>
            <hr style="border: 0; border-top: 1px solid #eee;">
            <p style="font-size: 14px; color: #666;">Спасибо, что выбрали ApexDrive!</p>
        </div>
    </div>
</body>
</html>
