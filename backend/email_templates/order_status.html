<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: sans-serif; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #e2e8f0; border-radius: 12px; padding: 30px;">
        <h2 style="color: #2563eb;">Статус вашего заказа обновлен</h2>
        <p>Здравствуйте, {{name}}!</p>
        <p>Информируем вас, что статус вашего заказа <b>#{{order_id}}</b> изменился на:</p>
        <div style="display: inline-block; padding: 8px 16px; background: #e0f2fe; color: #0369a1; border-radius: 20px; font-weight: bold; text-transform: uppercase;">
            {{status}}
        </div>
        <p style="margin-top: 20px;">Мы сообщим вам, когда товар прибудет в пункт выдачи.</p>
    </div>
</body>
</html>
